<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DigitalChair</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #eef2f7;
            overflow-x: hidden;
        }

        .sidebar {
            height: 100vh;
            background: linear-gradient(180deg, #1c2434 0%, #111827 100%);
            color: white;
            padding: 24px 18px;
            position: fixed;
            width: 260px;
            box-shadow: 0 0 30px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: #60a5fa;
        }

        .sidebar-section {
            color: #7f8ea3;
            font-size: 12px;
            text-transform: uppercase;
            margin-top: 25px;
            margin-bottom: 10px;
            padding-left: 12px;
            letter-spacing: 1px;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #d5dde7;
            text-decoration: none;
            padding: 14px 16px;
            border-radius: 14px;
            margin-bottom: 8px;
            transition: 0.2s ease;
            font-weight: 500;
        }

        .sidebar a:hover {
            background: rgba(255,255,255,0.08);
            transform: translateX(4px);
            color: white;
        }

        .sidebar a.active {
            background: linear-gradient(90deg, #2563eb 0%, #3b82f6 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(59,130,246,0.35);
        }

        .main-content {
            margin-left: 260px;
            padding: 30px;
        }

        .topbar {
            background: white;
            border-radius: 20px;
            padding: 18px 24px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.04);

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar-title h2 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            color: #111827;
        }

        .topbar-title p {
            margin: 0;
            color: #6b7280;
        }

        .profile-box {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #f3f6fb;
            padding: 10px 16px;
            border-radius: 14px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #60a5fa);

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-weight: 700;
        }

        .stat-card {
            background: white;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(15,23,42,0.05);
            border: 1px solid #e5e7eb;
            transition: 0.2s ease;
            height: 100%;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(15,23,42,0.08);
        }

        .stat-label {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .stat-value {
            font-size: 38px;
            font-weight: 700;
            color: #111827;
        }

        .section-card {
            background: white;
            border-radius: 24px;
            padding: 24px;
            margin-top: 24px;
            box-shadow: 0 8px 24px rgba(15,23,42,0.05);
            border: 1px solid #e5e7eb;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #111827;
        }

        .workload-item {
            margin-bottom: 20px;
        }

        .workload-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .progress {
            height: 14px;
            border-radius: 999px;
            background: #e5e7eb;
        }

        .progress-bar {
            border-radius: 999px;
        }

    </style>
</head>
<body>

<div class="sidebar">

    <div class="logo">
        Digital<span>Chair</span>
    </div>

    <div class="sidebar-section">
        Главное
    </div>

    <a href="/" class="active">
        🏠 Dashboard
    </a>

    <div class="sidebar-section">
        Кафедра
    </div>

    <a href="#">
        👨‍🏫 Teachers
    </a>

    <a href="#">
        📚 Subjects
    </a>

    <a href="#">
        📋 Workload
    </a>

    <a href="#">
        ✅ Assignments
    </a>

    <a href="#">
        📊 Reports
    </a>

</div>

<div class="main-content">

    <div class="topbar">

        <div class="topbar-title">

            <h2>DigitalChair ERP</h2>

            <p>
                Система автоматизации кафедры
            </p>

        </div>

        <div class="profile-box">

            <div class="avatar">
                A
            </div>

            <div>

                <strong>
                    Administrator
                </strong>

                <div style="font-size:13px;color:#6b7280;">

                    System Access

                </div>

            </div>

        </div>

    </div>

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
