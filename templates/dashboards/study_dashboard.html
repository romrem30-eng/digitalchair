<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">

    <title>Study Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body style="background:#f3f4f6;">

<div class="d-flex">

    <div style="
        width:260px;
        min-height:100vh;
        background:#334155;
        color:white;
        padding:30px;
        position:relative;
    ">

        <h3 style="font-weight:700;">

            DigitalChair

        </h3>

        <hr style="border-color:rgba(255,255,255,0.1);">

        <p>Главная</p>

        <p>Импорт Excel</p>
        <p>

    <a href="/study-workload/"
       style="color:white;text-decoration:none;">

        Учебная нагрузка

    </a>

</p>

        <p>Справочники</p>

        <p>Группы</p>

        <p>Отчёты</p>

        <div style="
            position:absolute;
            bottom:30px;
            left:30px;
            right:30px;
        ">

            <hr style="border-color:rgba(255,255,255,0.1);">

            <div class="d-flex align-items-center">

                <div style="
                    width:48px;
                    height:48px;
                    border-radius:50%;
                    background:#3b82f6;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    font-weight:700;
                    font-size:18px;
                    margin-right:12px;
                ">

                    {{ request.user.email|first|upper }}

                </div>

                <div>

                    <div style="
                        font-weight:600;
                        font-size:14px;
                    ">

                        {{ request.user.email }}

                    </div>

                    <div style="
                        font-size:12px;
                        opacity:0.7;
                    ">

                        {{ request.user.role }}

                    </div>

                </div>

            </div>

            <a href="/logout/"
               class="btn btn-outline-light w-100 mt-3">

                Выйти

            </a>

        </div>

    </div>

    <div class="p-5 w-100">

        <h1 style="font-weight:700;">

            Панель учебного мастера

        </h1>

        <p style="color:#6b7280;">

            Управление учебными данными и импортом.

        </p>

    </div>

</div>

</body>
</html>
