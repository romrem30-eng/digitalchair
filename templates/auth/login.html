<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DigitalChair Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {
            font-family: 'Inter', sans-serif;
        }

        body {

            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                    linear-gradient(
                            135deg,
                            #111827 0%,
                            #1e293b 100%
                    );

        }

        .login-card {

            width: 420px;

            background: white;

            border-radius: 28px;

            padding: 40px;

            box-shadow:
                    0 20px 60px rgba(0,0,0,0.25);

        }

        .logo {

            text-align: center;

            font-size: 34px;

            font-weight: 700;

            margin-bottom: 10px;

            color: #111827;

        }

        .logo span {
            color: #2563eb;
        }

        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-bottom: 35px;

        }

        .form-label {

            font-weight: 600;

            margin-bottom: 8px;

        }

        .form-control {

            height: 52px;

            border-radius: 14px;

            border: 1px solid #d1d5db;

        }

        .form-control:focus {

            border-color: #2563eb;

            box-shadow:
                    0 0 0 0.2rem rgba(37,99,235,0.15);

        }

        .btn-login {

            width: 100%;

            height: 52px;

            border-radius: 14px;

            border: none;

            background:
                    linear-gradient(
                            90deg,
                            #2563eb,
                            #3b82f6
                    );

            color: white;

            font-weight: 600;

            font-size: 16px;

            margin-top: 10px;

            transition: 0.2s ease;

        }

        .btn-login:hover {

            transform: translateY(-2px);

            box-shadow:
                    0 10px 20px rgba(37,99,235,0.25);

        }

        .forgot-password {

            text-align: center;

            margin-top: 20px;

        }

        .forgot-password a {

            text-decoration: none;

            color: #6b7280;

            font-size: 14px;

        }

        .forgot-password a:hover {

            color: #2563eb;

        }

        .system-version {

            text-align: center;

            margin-top: 25px;

            color: #9ca3af;

            font-size: 13px;

        }

        .alert {

            border-radius: 14px;

        }

    </style>

</head>
<body>

<div class="login-card">

    <div class="logo">

        Digital<span>Chair</span>

    </div>

    <div class="subtitle">

        Система автоматизации кафедры

    </div>

    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-danger">

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}

    <form method="post">

        {% csrf_token %}

        <div class="mb-3">

            <label class="form-label">

                Email

            </label>

            <input type="email"
                   name="email"
                   class="form-control"
                   placeholder="name@pgu.ru"
                   required>

        </div>

        <div class="mb-4">

            <label class="form-label">

                Пароль

            </label>

            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Введите пароль"
                   required>

        </div>

        <button type="submit"
                class="btn-login">

            Войти в систему

        </button>

    </form>

    <div class="forgot-password">

        <a href="#">

            Забыли пароль?

        </a>

    </div>

    <div class="system-version">

        DigitalChair ERP v1.0

    </div>

</div>

</body>
</html>
