<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Подтверждение входа</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">
    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #111827 0%, #1e293b 100%);
        }

        .verify-card {
            width: 420px;
            background: white;
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #111827;
        }

        .logo span {
            color: #2563eb;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-control {
            height: 52px;
            border-radius: 14px;
            border: 1px solid #d1d5db;
        }

        .btn-submit {
            width: 100%;
            height: 52px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(90deg, #2563eb, #3b82f6);
            color: white;
            font-weight: 600;
            margin-top: 10px;
        }
    </style>

</head>
<body>

<div class="verify-card">

    <div class="logo">
        Digital<span>Chair</span>
    </div>

    <div class="subtitle">
        Введите код из Google Authenticator для {{ email }}
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="form-label">TOTP-код</label>
            <input type="text"
                   name="code"
                   class="form-control"
                   placeholder="123456"
                   autocomplete="one-time-code"
                   required>
        </div>
        <button type="submit"
                class="btn-submit">
            Подтвердить вход
        </button>
    </form>

</div>

</body>
</html>
